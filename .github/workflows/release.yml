name: release

# Builds and releases the Windows installer whenever a `v*` tag is pushed.
# With the SIGNING_PFX_* secrets set the installer is Authenticode-signed
# with the project's own certificate; without them it ships unsigned and
# SmartScreen says "unknown publisher".
#
# The certificate is self-signed, so it is only trusted on machines that
# imported it (tools\trust-signing-cert.ps1) — good enough for a private
# fleet, worth nothing to strangers.
#
#     git tag v0.2.2
#     git push fork v0.2.2
# ...triggers this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create a GitHub Release

jobs:
  build:
    name: Build + (optional) sign Windows installer
    runs-on: windows-2022
    timeout-minutes: 75
    # SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD: self-signed certificate made
    # by tools\make-signing-cert.ps1 and uploaded by tools\push-signing-secrets.ps1.
    # Absent -> the installer is published unsigned.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Sync installer + app version with tag
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { $tag = "v0.0.0-${{ github.run_number }}" }
          $ver = $tag.TrimStart('v')
          Write-Host "Stamping app + installer with version $ver"
          # ${1} not $1: "$1$ver" would be parsed as group $10 when the
          # version starts with a digit, which silently deleted the whole
          # #define line and made ISCC fail with "Undeclared identifier".
          (Get-Content face_service\_version.py) -replace '(__version__\s*=\s*")[^"]+(")', "`${1}$ver`${2}" | Set-Content face_service\_version.py
          (Get-Content installer\installer.iss) -replace '(#define MyAppVersion ")[^"]+(")', "`${1}$ver`${2}" | Set-Content installer\installer.iss
          # Fail here rather than three steps later with a confusing error.
          $stamped = (Select-String -Path installer\installer.iss -Pattern "^#define MyAppVersion `"$ver`"$").Count
          if ($stamped -ne 1) { throw "installer.iss lost its MyAppVersion define" }
          if (-not (Select-String -Path face_service\_version.py -Pattern "$ver")) { throw "_version.py not stamped" }

      - name: Pre-download model weights
        shell: powershell
        run: python installer\download_weights.py

      - name: Build Credential Provider DLL
        shell: powershell
        continue-on-error: true
        run: |
          cd credential_provider
          cmake -B build -A x64 -G "Visual Studio 17 2022"
          cmake --build build --config Release

      - name: Build installer (PyInstaller + Inno Setup)
        shell: powershell
        run: python installer\build.py

      - name: Sign installer
        shell: powershell
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PW:  ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host "No SIGNING_PFX_BASE64 secret - publishing unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          try {
            Get-ChildItem installer_output\WindowsFaceUnlock-Setup-*.exe | ForEach-Object {
              & .\tools\sign-file.ps1 -Path $_.FullName -PfxPath $pfx -Password $env:PFX_PW
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # A signature that did not land must fail the release, not ship quietly.
          Get-ChildItem installer_output\WindowsFaceUnlock-Setup-*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) { throw "no signature on $($_.Name)" }
            if (-not $sig.TimeStamperCertificate) { throw "no RFC-3161 timestamp on $($_.Name)" }
          }

      - name: Regenerate checksum (covers signed & unsigned)
        shell: powershell
        run: |
          Get-ChildItem installer_output\WindowsFaceUnlock-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }

      - name: Collect artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            installer_output\WindowsFaceUnlock-Setup-*.exe
            installer_output\WindowsFaceUnlock-Setup-*.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/WindowsFaceUnlock-Setup-*.exe
            installer_output/WindowsFaceUnlock-Setup-*.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
